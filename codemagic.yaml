# Codemagic builds the iOS app on their Macs and uploads it to TestFlight.
# Same setup as Footballdle. Steps are in ios/README.md.
workflows:
  # Test builds: Google's test ads, so tapping ads on your own phone is safe.
  ios-testflight: &ios
    name: iOS → TestFlight (test ads)
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      # The App Store Connect API key already set up for Footballdle (team-wide).
      # Must match its name in Codemagic exactly, including the "Foodballdle" typo.
      app_store_connect: Foodballdle ASC
    environment:
      # "firebase" holds FIREBASE_PLIST (GoogleService-Info.plist, base64), never committed.
      groups:
        - firebase
      # Pinned by reference name (Codemagic → Settings → Code signing identities): the
      # profile regenerated with Sign in with Apple (M6). The older "dobie_dash_app_store"
      # copy lacks it and must not be picked.
      ios_signing:
        provisioning_profiles:
          - dobie_dash_app_store_siwa
        certificates:
          - footballdle-distribution
      # Real AdMob ids live in Codemagic (app > Environment variables, group "dobiedash"),
      # never in the repo. Only the release workflow below uses them.
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Numeric "Apple ID" from App Store Connect → Dobie Dash → App Information
        APP_STORE_APPLE_ID: 6836275397
        # RevenueCat public SDK key (meant to ship inside the app, like Footballdle's)
        REVENUECAT_APPLE_KEY: appl_bNBgRvCTrCViRnSJbYzYvyZWTVB
      node: 24
      xcode: 26.5
    # No triggering block: builds are started by hand so free minutes aren't used on every push.
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync into iOS project
        script: |
          if [ -z "$REVENUECAT_APPLE_KEY" ]; then echo "Warning: no REVENUECAT_APPLE_KEY, the Store won't load"; fi
          npm run cap:sync
      - name: Firebase config (analytics, crash reports, Remote Config)
        script: |
          if [ -z "$FIREBASE_PLIST" ]; then
            echo "Missing FIREBASE_PLIST (Codemagic group 'firebase'). Without it the app crashes on launch."
            exit 1
          fi
          echo "$FIREBASE_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
      - name: Real AdMob app id (when set)
        script: |
          if [ -n "$ADMOB_APP_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_APP_ID" ios/App/App/Info.plist
            echo "Using the real AdMob app id"
          else
            echo "No ADMOB_APP_ID: building with Google's test ads"
          fi
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Bump build number past the latest TestFlight build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Build signed .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # The App Store build: same steps, real AdMob ids from the "dobiedash" group.
  ios-release:
    <<: *ios
    name: iOS → App Store (real ads)
    environment:
      groups:
        - dobiedash
        - firebase
      # Pinned by reference name (Codemagic → Settings → Code signing identities): the
      # profile regenerated with Sign in with Apple (M6). The older "dobie_dash_app_store"
      # copy lacks it and must not be picked.
      ios_signing:
        provisioning_profiles:
          - dobie_dash_app_store_siwa
        certificates:
          - footballdle-distribution
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6836275397
        REVENUECAT_APPLE_KEY: appl_bNBgRvCTrCViRnSJbYzYvyZWTVB
      node: 24
      xcode: 26.5
